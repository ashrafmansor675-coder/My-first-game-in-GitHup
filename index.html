<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لعبتي الأولى</title>

  <style>
    body {
      text-align: center;
      font-family: Arial;
      background-color: lightblue;
      padding-top: 80px;
    }

    button {
      font-size: 25px;
      padding: 15px 30px;
      background-color: green;
      color: white;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <h1>لعبتي الأولى</h1>
  <h2>النقاط: <span id="points">0</span></h2>

  <button onclick="addPoint()">اضغط هنا</button>

  <script>
    let points = 0;

    function addPoint() {
      points = points + 1;
      document.getElementById("points").innerText = points;
    }
  </script>
</body>
</html>
